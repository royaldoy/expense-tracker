<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
			name="viewport"
		/>
		<meta content="mobile_blank" name="shell-type" />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdn.tailwindcss.com"></script>
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							primary: '#0058bc',
							'inverse-primary': '#adc6ff',
							'surface-container-low': '#f6f3f5',
							'surface-container-lowest': '#ffffff',
							'on-primary': '#ffffff',
							'surface-tint': '#005bc1',
							'primary-container': '0070eb',
							'on-tertiary-container': '#fffbff',
							'primary-fixed': '#d8e2ff',
							'on-primary-container': '#fefcff',
							surface: '#fcf8fb',
							'on-tertiary': '#ffffff',
							'surface-variant': '#e4e2e4',
							'on-error': '#ffffff',
							'on-surface-variant': '#414755',
							'tertiary-fixed': '#ffdad5',
							tertiary: '#bc000a',
							'on-error-container': '#93000a',
							'inverse-surface': '#303032',
							error: '#ba1a1a',
							secondary: '#006e28',
							'outline-variant': '#c1c6d7',
							'primary-fixed-dim': '#adc6ff',
							background: '#fcf8fb',
							'on-primary-fixed': '#001a41',
							'secondary-container': '#6ffb85',
							'on-secondary-container': '#00732a',
							'on-primary-fixed-variant': '#004493',
							'on-surface': '#1b1b1d',
							'secondary-fixed': '#72fe88',
							'on-secondary': '#ffffff',
							'surface-dim': '#dcd9dc',
							'tertiary-fixed-dim': '#ffb4aa',
							'on-tertiary-fixed': '#410001',
							'surface-container-highest': '#e4e2e4',
							outline: '#717786',
							'error-container': '#ffdad6',
							'secondary-fixed-dim': '#53e16f',
							'on-secondary-fixed': '#002107',
							'on-background': '#1b1b1d',
							'surface-bright': '#fcf8fb',
							'inverse-on-surface': '#f3f0f2',
							'on-secondary-fixed-variant': '#00531c',
							'on-tertiary-fixed-variant': '#930005',
							'surface-container': '#f0edef',
							'surface-container-high': '#eae7ea',
							'tertiary-container': '#e2241f'
						},
						borderRadius: { DEFAULT: '1rem', lg: '2rem', xl: '3rem', full: '9999px' },
						spacing: {
							'space-sm': '0.5rem',
							gutter: '1rem',
							margin: '1.25rem',
							'space-xl': '2rem',
							'space-md': '1rem',
							'space-lg': '1.5rem',
							'space-xs': '0.25rem'
						},
						fontFamily: {
							'title-2': ['Plus Jakarta Sans'],
							'currency-hero': ['Plus Jakarta Sans'],
							'large-title': ['Plus Jakarta Sans'],
							'title-3': ['Plus Jakarta Sans'],
							body: ['Plus Jakarta Sans'],
							'caption-2': ['Plus Jakarta Sans'],
							footnote: ['Plus Jakarta Sans'],
							subhead: ['Plus Jakarta Sans'],
							'currency-card': ['Plus Jakarta Sans'],
							headline: ['Plus Jakarta Sans'],
							callout: ['Plus Jakarta Sans'],
							'caption-1': ['Plus Jakarta Sans'],
							'title-1': ['Plus Jakarta Sans']
						},
						fontSize: {
							'title-2': [
								'22px',
								{ lineHeight: '28px', letterSpacing: '-0.26px', fontWeight: '700' }
							],
							'currency-hero': [
								'36px',
								{ lineHeight: '44px', letterSpacing: '-0.5px', fontWeight: '700' }
							],
							'large-title': [
								'34px',
								{ lineHeight: '41px', letterSpacing: '0.37px', fontWeight: '700' }
							],
							'title-3': [
								'20px',
								{ lineHeight: '25px', letterSpacing: '-0.45px', fontWeight: '600' }
							],
							body: ['17px', { lineHeight: '22px', letterSpacing: '-0.43px', fontWeight: '400' }],
							'caption-2': [
								'11px',
								{ lineHeight: '13px', letterSpacing: '0.07px', fontWeight: '600' }
							],
							footnote: [
								'13px',
								{ lineHeight: '18px', letterSpacing: '-0.08px', fontWeight: '400' }
							],
							subhead: [
								'15px',
								{ lineHeight: '20px', letterSpacing: '-0.24px', fontWeight: '500' }
							],
							'currency-card': [
								'24px',
								{ lineHeight: '30px', letterSpacing: '-0.3px', fontWeight: '700' }
							],
							headline: [
								'17px',
								{ lineHeight: '22px', letterSpacing: '-0.43px', fontWeight: '600' }
							],
							callout: [
								'16px',
								{ lineHeight: '21px', letterSpacing: '-0.32px', fontWeight: '500' }
							],
							'caption-1': [
								'12px',
								{ lineHeight: '16px', letterSpacing: '0px', fontWeight: '500' }
							],
							'title-1': [
								'28px',
								{ lineHeight: '34px', letterSpacing: '0.36px', fontWeight: '700' }
							]
						}
					}
				}
			};
		</script>
		<style>
			@layer base {
				html,
				body {
					width: 100vw;
					margin: 0;
					padding: 0;
				}
				body {
					overscroll-behavior: none;
				}
				.pb-safe {
					padding-bottom: env(safe-area-inset-bottom, 0px);
				}
				.pt-safe {
					padding-top: env(safe-area-inset-top, 0px);
				}
				main > :first-child {
					margin-top: 0 !important;
				}
				main > :last-child {
					margin-bottom: 0 !important;
				}
			}
			::-webkit-scrollbar {
				display: none;
			}
		</style>
	</head>
	<body
		class="bg-surface font-body text-body text-on-surface relative flex min-h-screen flex-col antialiased"
	>
		<main class="bg-surface relative w-full flex-1">
			<div class="relative flex w-full flex-col select-none">
				<!-- Backdrop Blur Layer over Beranda Dashboard -->
				<div
					class="fixed inset-0 z-30 bg-black/40 backdrop-blur-md transition-opacity duration-300"
				>
					<!-- Ambient Chromatic Glow Spheres behind frosted glass -->
					<div
						class="bg-primary/20 pointer-events-none absolute top-1/4 -left-12 h-64 w-64 rounded-full blur-3xl"
					></div>
					<div
						class="bg-secondary-container/25 pointer-events-none absolute top-1/3 -right-10 h-72 w-72 rounded-full blur-3xl"
					></div>
					<div
						class="bg-tertiary-fixed/20 pointer-events-none absolute bottom-20 left-10 h-56 w-56 rounded-full blur-3xl"
					></div>
				</div>
				<!-- Bottom Sheet Outer Container -->
				<div class="relative z-40 flex min-h-[720px] w-full flex-col justify-end">
					<!-- Liquid Glass Sheet Surface -->
					<div
						class="relative flex w-full flex-col overflow-hidden rounded-t-[32px] bg-white/80 px-5 pt-3 pb-8 shadow-2xl backdrop-blur-2xl"
					>
						<!-- Specular Top Rim Reflection Shelf -->
						<div
							class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-white/90 to-transparent"
						></div>
						<div
							class="pointer-events-none absolute inset-x-0 top-0.5 h-3 bg-gradient-to-b from-white/30 to-transparent"
						></div>
						<!-- iOS Grabber Pill Handle -->
						<div class="flex w-full items-center justify-center pt-1 pb-3">
							<div class="bg-outline-variant/60 h-1 w-9 rounded-full"></div>
						</div>
						<!-- Sheet Header Section -->
						<div class="mt-1 mb-5 flex items-center justify-between">
							<div class="flex flex-col">
								<div class="flex items-center gap-2">
									<h2 class="font-title-2 text-title-2 text-on-surface tracking-tight">
										Transaksi Cepat
									</h2>
									<span
										class="bg-primary/10 text-primary font-caption-2 text-caption-2 inline-flex items-center justify-center rounded-full px-2 py-0.5"
									>
										Liquid Pay
									</span>
								</div>
								<p class="font-footnote text-footnote text-on-surface-variant mt-0.5">
									Pilih jenis pencatatan finansial Anda
								</p>
							</div>
							<!-- Glass Dismiss Close Button (✕) -->
							<button
								aria-label="Tutup"
								class="bg-surface-container-high/70 text-on-surface-variant flex h-9 w-9 items-center justify-center rounded-full shadow-sm backdrop-blur-md transition-transform duration-150 active:scale-95"
								type="button"
							>
								<span class="material-symbols-outlined text-[19px]">close</span>
							</button>
						</div>
						<!-- Primary Action Grid: 2x2 Hero Glass Action Cards -->
						<div class="mb-5 grid grid-cols-2 gap-3">
							<!-- 1. Catat Pengeluaran (Expense) -->
							<button
								class="group bg-surface-container-lowest/80 relative flex flex-col items-start overflow-hidden rounded-lg p-4 text-left shadow-sm backdrop-blur-xl transition-all duration-200 active:scale-[0.98]"
								type="button"
							>
								<!-- Subtle specular catch-light -->
								<div
									class="from-tertiary/5 pointer-events-none absolute inset-0 bg-gradient-to-br via-transparent to-transparent opacity-80"
								></div>
								<!-- Top Row: Icon + Badge -->
								<div class="mb-3 flex w-full items-center justify-between">
									<div
										class="bg-tertiary-fixed text-tertiary flex h-11 w-11 items-center justify-center rounded-full shadow-sm"
									>
										<span
											class="material-symbols-outlined text-[22px]"
											style="font-variation-settings: 'FILL' 1"
											>arrow_outward</span
										>
									</div>
									<span
										class="bg-tertiary/10 text-tertiary font-caption-2 text-caption-2 rounded-full px-2 py-0.5 tracking-tight"
									>
										Paling Sering
									</span>
								</div>
								<span class="font-headline text-headline text-on-surface mb-0.5">Pengeluaran</span>
								<span class="font-caption-1 text-caption-1 text-on-surface-variant line-clamp-1"
									>Belanja, tagihan, makan</span
								>
							</button>
							<!-- 2. Catat Pemasukan (Income) -->
							<button
								class="group bg-surface-container-lowest/80 relative flex flex-col items-start overflow-hidden rounded-lg p-4 text-left shadow-sm backdrop-blur-xl transition-all duration-200 active:scale-[0.98]"
								type="button"
							>
								<div
									class="from-secondary/5 pointer-events-none absolute inset-0 bg-gradient-to-br via-transparent to-transparent opacity-80"
								></div>
								<div class="mb-3 flex w-full items-center justify-between">
									<div
										class="bg-secondary-fixed text-on-secondary-fixed-variant flex h-11 w-11 items-center justify-center rounded-full shadow-sm"
									>
										<span
											class="material-symbols-outlined text-[22px]"
											style="font-variation-settings: 'FILL' 1"
											>south_west</span
										>
									</div>
								</div>
								<span class="font-headline text-headline text-on-surface mb-0.5">Pemasukan</span>
								<span class="font-caption-1 text-caption-1 text-on-surface-variant line-clamp-1"
									>Gaji, freelance, dividen</span
								>
							</button>
							<!-- 3. Transfer Saldo (Transfer) -->
							<button
								class="group bg-surface-container-lowest/80 relative flex flex-col items-start overflow-hidden rounded-lg p-4 text-left shadow-sm backdrop-blur-xl transition-all duration-200 active:scale-[0.98]"
								type="button"
							>
								<div
									class="from-primary/5 pointer-events-none absolute inset-0 bg-gradient-to-br via-transparent to-transparent opacity-80"
								></div>
								<div class="mb-3 flex w-full items-center justify-between">
									<div
										class="bg-primary-fixed text-primary flex h-11 w-11 items-center justify-center rounded-full shadow-sm"
									>
										<span
											class="material-symbols-outlined text-[22px]"
											style="font-variation-settings: 'FILL' 1"
											>sync_alt</span
										>
									</div>
								</div>
								<span class="font-headline text-headline text-on-surface mb-0.5"
									>Transfer Saldo</span
								>
								<span class="font-caption-1 text-caption-1 text-on-surface-variant line-clamp-1"
									>Antar rekening &amp; e-wallet</span
								>
							</button>
							<!-- 4. Scan Struk / QRIS AI (AI Scan) -->
							<button
								class="group bg-surface-container-lowest/80 relative flex flex-col items-start overflow-hidden rounded-lg p-4 text-left shadow-sm backdrop-blur-xl transition-all duration-200 active:scale-[0.98]"
								type="button"
							>
								<div
									class="from-primary-fixed/20 via-primary/5 pointer-events-none absolute inset-0 bg-gradient-to-br to-transparent opacity-90"
								></div>
								<div class="mb-3 flex w-full items-center justify-between">
									<div
										class="bg-primary text-on-primary flex h-11 w-11 items-center justify-center rounded-full shadow-md"
									>
										<span class="material-symbols-outlined text-[22px]">document_scanner</span>
									</div>
									<span
										class="bg-primary text-on-primary font-caption-2 text-caption-2 flex items-center gap-1 rounded-full px-2 py-0.5 shadow-sm"
									>
										<span
											class="material-symbols-outlined text-[11px]"
											style="font-variation-settings: 'FILL' 1"
											>auto_awesome</span
										>
										Otomatis
									</span>
								</div>
								<span class="font-headline text-headline text-on-surface mb-0.5"
									>Scan Struk AI</span
								>
								<span class="font-caption-1 text-caption-1 text-on-surface-variant line-clamp-1"
									>Ekstrak struk otomatis</span
								>
							</button>
						</div>
						<!-- Quick Amount Shortcut Bar (Pencatatan Kilat) -->
						<div class="mb-4 w-full">
							<div class="mb-2 flex items-center justify-between px-1">
								<span
									class="font-subhead text-subhead text-on-surface flex items-center gap-1.5 font-semibold"
								>
									<span>⚡️</span> Pencatatan Kilat Terakhir
								</span>
								<span
									class="font-caption-2 text-caption-2 text-primary font-semibold tracking-wider uppercase"
									>1-Sentuh</span
								>
							</div>
							<!-- Horizontal Scrollable Glass Chips -->
							<div class="no-scrollbar flex items-center gap-2 overflow-x-auto py-1">
								<!-- Chip 1 -->
								<button
									class="bg-surface-container-low/90 active:bg-surface-container-high flex flex-shrink-0 items-center gap-1.5 rounded-full px-3 py-2 text-left shadow-sm backdrop-blur-md transition-colors"
									type="button"
								>
									<span class="text-sm">☕️</span>
									<span class="font-footnote text-footnote text-on-surface font-medium"
										>Kopi Harian</span
									>
									<span class="font-caption-1 text-caption-1 text-on-surface-variant font-semibold"
										>Rp25.000</span
									>
								</button>
								<!-- Chip 2 -->
								<button
									class="bg-surface-container-low/90 active:bg-surface-container-high flex flex-shrink-0 items-center gap-1.5 rounded-full px-3 py-2 text-left shadow-sm backdrop-blur-md transition-colors"
									type="button"
								>
									<span class="text-sm">🍜</span>
									<span class="font-footnote text-footnote text-on-surface font-medium"
										>Makan Siang</span
									>
									<span class="font-caption-1 text-caption-1 text-on-surface-variant font-semibold"
										>Rp45.000</span
									>
								</button>
								<!-- Chip 3 -->
								<button
									class="bg-surface-container-low/90 active:bg-surface-container-high flex flex-shrink-0 items-center gap-1.5 rounded-full px-3 py-2 text-left shadow-sm backdrop-blur-md transition-colors"
									type="button"
								>
									<span class="text-sm">🚗</span>
									<span class="font-footnote text-footnote text-on-surface font-medium"
										>Parkir/Tol</span
									>
									<span class="font-caption-1 text-caption-1 text-on-surface-variant font-semibold"
										>Rp10.000</span
									>
								</button>
								<!-- Chip 4 -->
								<button
									class="bg-surface-container-low/90 active:bg-surface-container-high flex flex-shrink-0 items-center gap-1.5 rounded-full px-3 py-2 text-left shadow-sm backdrop-blur-md transition-colors"
									type="button"
								>
									<span class="text-sm">🛒</span>
									<span class="font-footnote text-footnote text-on-surface font-medium"
										>Minimarket</span
									>
									<span class="font-caption-1 text-caption-1 text-on-surface-variant font-semibold"
										>Rp50.000</span
									>
								</button>
							</div>
						</div>
						<!-- Smart Integration & Voice Input Pill Banner -->
						<button
							class="bg-surface-container-low/80 mb-4 flex w-full items-center justify-between rounded-lg p-3.5 text-left shadow-sm backdrop-blur-xl transition-transform duration-150 active:scale-[0.99]"
							type="button"
						>
							<div class="flex min-w-0 items-center gap-3">
								<div
									class="bg-primary-fixed text-primary flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full shadow-sm"
								>
									<span
										class="material-symbols-outlined text-[20px]"
										style="font-variation-settings: 'FILL' 1"
										>mic</span
									>
								</div>
								<div class="flex min-w-0 flex-col">
									<div class="flex items-center gap-1.5">
										<span class="font-subhead text-subhead text-on-surface truncate font-semibold"
											>Dikte ke Liquid AI</span
										>
										<span class="bg-secondary h-1.5 w-1.5 animate-pulse rounded-full"></span>
									</div>
									<span class="font-footnote text-footnote text-on-surface-variant truncate"
										>"Beli bensin 50 ribu pakai Gopay"</span
									>
								</div>
							</div>
							<!-- Animated Audio Waveform Graphic Indicator -->
							<div class="flex flex-shrink-0 items-center gap-0.5 px-2">
								<span
									class="bg-primary/60 h-3.5 w-0.5 animate-bounce rounded-full"
									style="animation-delay: 0.1s"
								></span>
								<span
									class="bg-primary h-5 w-0.5 animate-bounce rounded-full"
									style="animation-delay: 0.25s"
								></span>
								<span
									class="bg-primary/50 h-2.5 w-0.5 animate-bounce rounded-full"
									style="animation-delay: 0.4s"
								></span>
								<span
									class="bg-primary/80 h-4 w-0.5 animate-bounce rounded-full"
									style="animation-delay: 0.15s"
								></span>
							</div>
						</button>
						<!-- Dismiss Button (Batal) -->
						<button
							class="bg-surface-container-high/80 text-on-surface font-headline text-headline w-full rounded-full py-3.5 text-center shadow-sm backdrop-blur-md transition-transform duration-150 active:scale-[0.98]"
							type="button"
						>
							Batal
						</button>
						<!-- iOS Home Indicator Spacing -->
						<div class="flex w-full justify-center pt-3 pb-1">
							<div class="bg-on-surface/20 h-1 w-32 rounded-full"></div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
